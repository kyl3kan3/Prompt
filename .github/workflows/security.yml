name: Security regression checks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test test/local-request.security.mjs
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node --test test/local-http.security.mjs
